name: Verify live Quote API consumer
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Sync published OpenAPI contract
        run: npm run sync-contract
      - name: Commit a changed contract for Mender to observe
        run: |
          if ! git diff --quiet -- openapi.json; then
            git config user.name 'API Mender Pilot'
            git config user.email 'pilot@users.noreply.github.com'
            git add openapi.json
            git commit -m 'Sync published Quote API contract'
            git push
          fi
      - name: Verify the consumer against the live API
        run: PILOT_LIVE=1 npm test
